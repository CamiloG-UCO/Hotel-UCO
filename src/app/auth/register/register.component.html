<div class="register-container">
  <div class="register-form-section">
    <div class="form-wrapper">
      <h1 class="title">Registro</h1>
      <p class="subtitle">Crea tu cuenta</p>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" type="text" formControlName="name" placeholder="Tu nombre completo" />
          <div class="error" *ngIf="submitted && f['name'].invalid">
            <small *ngIf="f['name'].errors?.['required']">El nombre es requerido.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="tu@correo.com" />
          <div class="error" *ngIf="submitted && f['email'].invalid">
            <small *ngIf="f['email'].errors?.['required']">El correo es requerido.</small>
            <small *ngIf="f['email'].errors?.['email']">Formato inválido.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="********" />
          <div class="error" *ngIf="submitted && f['password'].invalid">
            <small *ngIf="f['password'].errors?.['required']">La contraseña es requerida.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Rol</label>
          <select id="role" formControlName="role">
            <option value="">Selecciona un rol</option>
            <option *ngFor="let role of roles" [value]="role.id">
              {{ role.name || role.nombre }}
            </option>
          </select>
          <div class="error" *ngIf="submitted && f['role'].invalid">
            <small *ngIf="f['role'].errors?.['required']">El rol es obligatorio.</small>
          </div>
        </div>

        <button type="submit" class="btn-submit">Registrar</button>

        <div class="error-server" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>
      <div class="register-link">
        <p>¿Ya tienes cuenta?
          <span class="link" (click)="onLoginClick()">Inicia sesión aquí</span>
        </p>
      </div>
    </div>
  </div>

  <div class="register-bg-section">
    <div class="overlay">
      HOTEL APP
    </div>
  </div>
</div>
