<div class="login-container">
  <div class="login-form-section">
    <div class="form-wrapper">
      <h1 class="title">Iniciar Sesión</h1>
      <p class="subtitle">Bienvenido de nuevo</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" formControlName="email" placeholder="tu@correo.com" />
          <div class="error" *ngIf="submitted && f.email.invalid">
            <small *ngIf="f.email.errors?.['required']">El correo es requerido.</small>
            <small *ngIf="f.email.errors?.['email']">Formato de correo inválido.</small>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" formControlName="password" placeholder="********" />
          <div class="error" *ngIf="submitted && f.password.invalid">
            <small *ngIf="f.password.errors?.['required']">La contraseña es requerida.</small>
          </div>
        </div>

        <button type="submit" class="btn-submit">Entrar</button>

        <div class="error-server" *ngIf="errorMessage">
          {{ errorMessage }}
        </div>
      </form>

      <div class="register-link">
        <p>¿No tienes cuenta?
          <span class="link" (click)="onRegisterClick()">Regístrate aquí</span>
        </p>
      </div>
    </div>
  </div>

  <div class="login-bg-section">
    <div class="overlay">
      HOTEL APP
    </div>
  </div>

</div>
