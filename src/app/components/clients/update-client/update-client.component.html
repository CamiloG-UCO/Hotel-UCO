<div class="update-client-container">
    <div class="header-section">
        <div class="icon-badge">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
            </svg>
        </div>
        <div class="title-container">
            <h1 class="title">Actualizar Cliente</h1>
            <p class="subtitle">Completa el formulario para actualizar la información del cliente</p>
        </div>
    </div>

    <section class="client-card">
        <form [formGroup]="updateForm" (ngSubmit)="updateClient()" class="updateClient-form">
            <div class="form-section">
                <h2 class="section-title">Información Personal</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="name" class="form-label">
                            <svg class="label-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            Nombre
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="name"
                            formControlName="name" 
                            class="form-control"
                            placeholder="Ingresa el nombre"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="lastNames" class="form-label">
                            <svg class="label-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            Apellido
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="lastNames"
                            formControlName="lastNames" 
                            class="form-control"
                            placeholder="Ingresa el apellido"
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">Documentación</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="documentType" class="form-label">
                            <svg class="label-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                <polyline points="14 2 14 8 20 8"></polyline>
                            </svg>
                            Tipo de Documento
                            <span class="required">*</span>
                        </label>
                        <!-- Cambiado de select a input text para permitir entrada libre -->
                        <input 
                            type="text" 
                            id="documentType"
                            formControlName="documentType" 
                            class="form-control"
                            placeholder="Ej: NIT, PASS, CC, TI, CE"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="documentNumber" class="form-label">
                            <svg class="label-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                                <line x1="1" y1="10" x2="23" y2="10"></line>
                            </svg>
                            Número de Documento
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="text" 
                            id="documentNumber"
                            formControlName="documentNumber" 
                            class="form-control"
                            placeholder="Ingresa el número"
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2 class="section-title">Información de Contacto</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="email" class="form-label">
                            <svg class="label-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            Correo Electrónico
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="email"
                            formControlName="email" 
                            class="form-control"
                            placeholder="ejemplo@correo.com"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone" class="form-label">
                            <svg class="label-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            Teléfono o Celular
                            <span class="required">*</span>
                        </label>
                        <input 
                            type="tel" 
                            id="phone"
                            formControlName="phone" 
                            class="form-control"
                            placeholder="+57 300 123 4567"
                            required
                        >
                    </div>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="history.back()">
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                    Cancelar
                </button>
                <button type="submit" class="btn-submit">
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Guardar Actualización
                </button>
            </div>
        </form>
    </section>
</div>
