<mat-card class="panel">
  <h2>Gestión de Empleados</h2>
  <!-- Botones de acción -->
    <div class="action-buttons">
    <button mat-raised-button color="primary" (click)="irRegistrarEmpleado()">
      <mat-icon>person_add</mat-icon> Registrar Empleado
    </button>
    <button mat-raised-button color="accent" (click)="irActualizarEmpleado()">
      <mat-icon>edit</mat-icon> Actualizar Empleado
    </button>
    <button mat-raised-button color="warn" (click)="irEliminarEmpleado()">
      <mat-icon>delete</mat-icon> Eliminar Empleado
    </button>
  </div>

    <button mat-raised-button color="primary" class="home-btn" (click)="irHome()">
        <mat-icon>arrow_back</mat-icon> Home
    </button>




  <!-- Filtros -->
  <div class="filters">
    <mat-form-field appearance="fill" color="primary">
      <mat-label>Buscar por código</mat-label>
      <input matInput [(ngModel)]="codigoBuscar" placeholder="EMP-1234">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="buscarPorCodigo()">Buscar</button>

    <mat-form-field appearance="fill" color="accent">
      <mat-label>Filtrar por hotel</mat-label>
      <mat-select [(ngModel)]="hotelBuscar">
        <mat-option *ngFor="let hotel of hoteles" [value]="hotel">{{ hotel }}</mat-option>
      </mat-select>
    </mat-form-field>
    <button mat-raised-button color="accent" (click)="filtrarPorHotel()">Filtrar</button>
  </div>

  <!-- Tabla de empleados -->
  <div class="table-wrapper" *ngIf="empleados.length; else emptyState">
    <table mat-table [dataSource]="empleados" class="mat-elevation-z4">

      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Código</th>
        <td mat-cell *matCellDef="let e">{{ e.code }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let e">{{ e.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let e">{{ e.email }}</td>
      </ng-container>

      <ng-container matColumnDef="roles">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let e">{{ e.roles }}</td>
      </ng-container>

      <ng-container matColumnDef="hotel">
        <th mat-header-cell *matHeaderCellDef>Hotel</th>
        <td mat-cell *matCellDef="let e">{{ e.hotel }}</td>
      </ng-container>

      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef>Salario</th>
        <td mat-cell *matCellDef="let e">{{ e.salary | currency:'COP':'symbol':'1.0-0' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let e">
          <button mat-raised-button color="primary" class="action-btn">
            Descargar ficha
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <ng-template #emptyState>
    <p class="empty">No hay empleados para mostrar.</p>
  </ng-template>
</mat-card>
