<div class="cancel-reservation-container">
  <div class="card">
    <div class="header-section">
      <h2>Gestionar Reservas</h2>
      <button (click)="goHome()" class="btn btn-secondary btn-header">
        ← Volver a Home
      </button>
    </div>

    <!-- Botón para generar Reserva de Prueba -->
    <div class="dummy-action-section">
      <button 
        (click)="loadDummyBooking()" 
        [disabled]="loading"
        class="btn btn-primary btn-lg"
      >
        <span *ngIf="!loading">Generar Reserva de Prueba</span>
        <span *ngIf="loading">Generando...</span>
      </button>
    </div>

    <!-- Sección de Carga -->
    <div *ngIf="loading" class="loading-section">
      <p>Cargando reservas...</p>
    </div>

    <!-- Tabla de Reservas -->
    <div class="bookings-section" *ngIf="!loading && bookings.length > 0">
      <h3>Todas las Reservas</h3>
      <div class="table-responsive">
        <table class="bookings-table">
          <thead>
            <tr>
              <th>Cliente</th>
              <th>Email</th>
              <th>Hotel</th>
              <th>Habitación</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let booking of bookings" [class.loading-row]="canceling">
              <td>{{ booking.client?.name }}</td>
              <td>{{ booking.client?.email }}</td>
              <td>{{ booking.room?.hotel?.name }}</td>
              <td>{{ booking.room?.code }}</td>
              <td>
                <button
                  (click)="cancelBooking(booking.room?.code, booking.id, booking.client?.email)"
                  [disabled]="canceling"
                  class="btn btn-danger btn-sm"
                >
                  Cancelar
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Mensaje cuando no hay reservas -->
    <div *ngIf="!loading && bookings.length === 0" class="no-bookings">
      <p>No hay reservas disponibles</p>
    </div>
  </div>
</div>
