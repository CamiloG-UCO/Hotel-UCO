<div id="rsv-main">
    <h1 class="color-primary">Reservas</h1>
    <button class="create-rsv-button" type="button" (click)="openCreateDialog()"><u>Crear reserva +</u></button>
    <div id="rsv-list" *ngIf="!loading">
        <app-reservation-item
            *ngFor="let r of reservations"
            [reservation]="r"
            (cancelClick)="onCancelReservation($event)"
            (checkInClick)="onCheckInReservation($event)"
        >
        </app-reservation-item>
    </div>
</div>
