<div class="dialog-content">
    <p>¿Seguro(a) que desea cancelar la reserva?</p>
    <div class="dialog-button-pair">
        <button class="dialog-button-cancel" type="button" (click)="onDesicion(false)">
            <b>No</b>
        </button>
        <button class="dialog-button-confirm" type="button" (click)="onDesicion(true)">
            <b>Sí</b>
        </button>
    </div>
</div>
