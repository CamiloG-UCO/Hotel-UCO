<div class="eliminar-empleado-container">
  <h2>Eliminar empleado</h2>

  <!-- Buscar empleado -->
  <form (ngSubmit)="buscarEmpleado()" class="buscar-form">
    <label for="idEmpleado">ID o código del empleado</label>
    <input
      type="text"
      id="idEmpleado"
      name="idEmpleado"
      [(ngModel)]="idEmpleado"
      required
      placeholder="Ejemplo: EMP-1234 o UUID"
    />
    <button type="submit" class="btn-buscar" [disabled]="cargando">
      {{ cargando ? 'Buscando...' : 'Buscar' }}
    </button>
  </form>

  <!-- Información del empleado -->
  <div *ngIf="encontrado && empleado" class="empleado-info">
    <h3>Información del empleado</h3>
    <p><strong>Nombre:</strong> {{ empleado.name }}</p>
    <p><strong>Correo:</strong> {{ empleado.email }}</p>
    <p><strong>Rol:</strong> {{ empleado.role?.name || empleado.role }}</p>
    <p><strong>Hotel:</strong> {{ empleado.hotel }}</p>

    <button
      class="btn-eliminar"
      (click)="eliminarEmpleado()"
      [disabled]="cargando"
    >
      {{ cargando ? 'Eliminando...' : 'Eliminar empleado' }}
    </button>
  </div>
</div>
