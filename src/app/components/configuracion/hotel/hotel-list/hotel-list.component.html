<nav class="navbar">
    <div class="nav-left">
        <h3>Hotel App</h3>
    </div>

    <div class="nav-right">
        <button (click)="goToCreateHotel()" class="config-button-menu">Registrar Hotel</button>
        <button (click)="logout()" class="config-button-menu">Cerrar sesión</button>
    </div>
</nav>

<nav>
    <div class="card-body">
        <div class="top-box">
            <nav class="search-box">
                <input type.="search" 
                   class="search-box" 
                   placeholder="Buscar por código de hotel"
                   [(ngModel)]="terminoBusqueda"
                   (keyup.enter)="buscarHotel()">
                <button class="button-search" (click)="buscarHotel()">Buscar</button>
            </nav>

        </div>
        <div class="table-box">
            <table>
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Nombre</th>
                        <th>Ciudad</th>
                        <th>Departamento</th>
                        <th>País</th>
                        <th>telefono</th>
                        <th>Opciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let hotel of hotels">
                        <td>{{hotel?.hotelCodigo}}</td>
                        <td>{{hotel?.nombre}}</td>
                        <td>{{hotel?.ciudad}}</td>
                        <td>{{hotel?.departamento}}</td>
                        <td>{{hotel?.pais}}</td>
                        <td>{{hotel?.telefono}}</td>
                        <td class="opciones">
                                <button (click)="goToEditHotel(hotel)" class="btn-action btn-edit">
                                    Editar
                                </button>
                                <button (click)="goToViewHotel()" class="btn-action btn-view">
                                    Ver
                                </button>

                        </td>
                    </tr>
                </tbody>

            </table>
        </div>
        
    </div>
</nav>
